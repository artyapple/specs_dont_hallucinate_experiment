version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: generated
        out: internal/repository/generated
        sql_package: pgx/v5
        emit_interface: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: pg_catalog.timestamptz
            go_type:
              import: time
              type: Time
